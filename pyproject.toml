[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-video-highlight"
version = "0.1.0"
description = "High-recall candidate retrieval baseline for general video highlight detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "openai>=1.60,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
